# Deployment blueprint only; no services or accounts are created by this file.
services:
  - type: web
    name: mizemi-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python -m app
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MIZEMI_QUESTIONS_PER_GAME
        value: "20"
      - key: MIZEMI_QUESTION_TIME_LIMIT_SECONDS
        value: "20"
      - key: MIZEMI_RETENTION_DAYS
        value: "7"
      # Optional AI question mode (MASTER_SPEC.md 12.7). Off until you opt in.
      # Deploy with "false" first; set the key privately in the dashboard.
      - key: MIZEMI_AI_ENABLED
        value: "false"
      - key: MIZEMI_ANTHROPIC_API_KEY
        sync: false
      - key: MIZEMI_AI_MAX_GAMES_PER_HOUR
        value: "20"
  - type: web
    name: mizemi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "26"
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WS_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
